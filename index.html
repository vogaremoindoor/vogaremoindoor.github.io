    <title>Voga - Remo Indoor</title>
    <script>
      // Migra os dados salvos com o nome antigo do app (treino-remo:*) para as chaves novas (voga:*).
      try {
        for (const k of ["treinos", "tema", "lista"]) {
          const antiga = `treino-remo:${k}`, nova = `voga:${k}`, v = localStorage.getItem(antiga);
          if (v === null) continue;
          if (localStorage.getItem(nova) === null) localStorage.setItem(nova, v);
          localStorage.removeItem(antiga);
        }
      } catch {}
      // Aplica a paleta escolhida antes do app carregar, para a tela não piscar com as cores padrão.
      try {
        const p = JSON.parse(localStorage.getItem("voga:config") || "{}").paleta;
        if (["oceano", "vermelho", "violeta", "grafite"].includes(p)) document.documentElement.dataset.paleta = p;
      } catch {}
    </script>
